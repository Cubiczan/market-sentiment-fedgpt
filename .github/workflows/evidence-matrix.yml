# Evidence-matrix gate — vendored from the Cubiczan standard kit
# (canonical kit: icohangar-ops/consensus-hardening-protocol, PR #5, commit 88067e4).
# Refuses the build while any claim in evidence/matrix.yaml is unverifiable.
# Required: a red matrix job means the README's capability claims are not
# evidence-backed. No secrets, no service containers. Runs BEFORE any install
# step — the verifier and the scripts it executes are stdlib-only.
name: evidence-matrix

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify evidence matrix (fail-closed, pre-install)
        run: python3 tools/verify_evidence_matrix.py
